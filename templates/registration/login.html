{% extends "base.html" %}

{% block title %}Log In{% endblock %}

{% block content %}
<section class="panel narrow">
    <h2>Management Login</h2>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Log In</button>

        {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
        {% endif %}
    </form>
</section>
{% endblock %}
