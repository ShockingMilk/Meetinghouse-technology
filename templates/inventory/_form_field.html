<div class="form-field{% if field.errors %} has-error{% endif %}">
    <div class="field-label-row">{{ field.label_tag }}{% if field.field.required %}<span class="required-mark">Required</span>{% endif %}</div>
    {{ field }}
    {% if field.help_text %}<span class="field-help">{{ field.help_text }}</span>{% endif %}
    {% if field.errors %}<div class="field-errors" role="alert">{{ field.errors }}</div>{% endif %}
</div>
