services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: meetinghouse-web

    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --timeout 60

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production

    volumes:
      - meetinghouse_prod_data:/app/data

    expose:
      - "8000"

    restart: unless-stopped

  nginx:
    image: nginx:stable

    container_name: meetinghouse-nginx

    depends_on:
      - web

    ports:
      - "${MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:${MANAGEMENT_PORT:-8080}:80"

    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    restart: unless-stopped

volumes:
  meetinghouse_prod_data:
